name: publish-sdk

# Tagging `sdk-vX.Y.Z` publishes @dosu-ai/sessiondb X.Y.Z to npm (with provenance). The tag must
# match sdks/typescript/package.json's version, which every trace's `normalizer` reports. The
# server has its own tags (`vX.Y.Z`, release.yml); the two move independently.
#
# Needs the `NPM_TOKEN` repository secret: an npm granular access token with publish rights on
# the @dosu-ai scope (bypassing 2FA for automation).
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches sdks/typescript/package.json
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          version="$(jq -r .version sdks/typescript/package.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag sdk-v$tag does not match sdks/typescript/package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

      - name: Build dist/ and check it loads under Node
        working-directory: sdks/typescript
        run: |
          bun run build
          node -e 'import("./dist/index.js").then((m) => console.log("@dosu-ai/sessiondb", m.VERSION))'

      - name: Publish
        working-directory: sdks/typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
