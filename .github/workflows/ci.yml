name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      s3:
        image: rustfs/rustfs:latest
        ports: ["9000:9000"]
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - name: Create the S3 test bucket
        run: |
          pip install --quiet awscli
          AWS_ACCESS_KEY_ID=rustfsadmin AWS_SECRET_ACCESS_KEY=rustfsadmin AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://sessiondb-test
      - name: S3 store test against a live endpoint
        env:
          SESSIONDB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SESSIONDB_TEST_S3_BUCKET: sessiondb-test
          SESSIONDB_TEST_S3_ACCESS_KEY: rustfsadmin
          SESSIONDB_TEST_S3_SECRET_KEY: rustfsadmin
        run: bun --bun vitest run sdks/typescript/src/store/s3.test.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f server/Dockerfile -t sessiondb .
      - name: Boot against a file store and hit /healthz
        run: |
          docker run -d --name sessiondb -p 7200:7200 \
            -e SESSIONDB_TOKEN=ci-token-0123456789abcdef -e SESSIONDB_STORE_URL=file:///data sessiondb
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:7200/healthz && exit 0
            sleep 1
          done
          docker logs sessiondb
          exit 1

  # Every push to main with a Conventional Commit since the last release is a release
  # (release.config.js): the version is chosen from the commits, @dosu/sessiondb goes to npm with
  # provenance, a vX.Y.Z tag and a GitHub release are cut, and the image job below publishes
  # ghcr.io/dosu-ai/sessiondb at the same version. Needs the NPM_TOKEN repository secret: an npm
  # granular token with publish rights on the @dosu org.
  release:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - id: release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # dist/ is built once by the release's prepare step; do not let prepack rebuild it.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"

  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The release commit, not the push that triggered the run: it carries the version
      # server/package.json reports from /healthz.
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
